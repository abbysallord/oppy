<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF85" />
      <stop offset="100%" stop-color="#1E90FF" />
    </linearGradient>
    <!-- Soft Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF85" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00FF85" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#glowGrad)" />
  
  <!-- Outer Precision Segments (Electric Blue) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E90FF" stroke-width="4" stroke-opacity="0.15" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E90FF" stroke-width="8" stroke-dasharray="140 40 20 40 80 40" stroke-linecap="round" />
  
  <!-- Inner Dynamic Scanner Arc (Neon Green) -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00FF85" stroke-width="12" stroke-dasharray="280 140" stroke-linecap="round" />
  
  <!-- Reticle Crosshair Ticks -->
  <line x1="256" y1="20" x2="256" y2="60" stroke="#00FF85" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="452" x2="256" y2="492" stroke="#00FF85" stroke-width="6" stroke-linecap="round" />
  <line x1="20" y1="256" x2="60" y2="256" stroke="#00FF85" stroke-width="6" stroke-linecap="round" />
  <line x1="452" y1="256" x2="492" y2="256" stroke="#00FF85" stroke-width="6" stroke-linecap="round" />

  <!-- Center Glowing Scout Core (Oppy 'O') -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#primaryGrad)" stroke-width="20" />
  <circle cx="256" cy="256" r="20" fill="#00FF85" />
</svg>
